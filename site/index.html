    function key(e){
      if(e.key==='Escape'){e.preventDefault();close('cancel');}
      else if(e.key==='Tab'){var f=$$('input,select,textarea,button',form).filter(function(x){return !x.disabled&&x.offsetParent!==null;});if(!f.length)return;var first=f[0],last=f[f.length-1];
        if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
    }
    document.addEventListener('keydown',key,true);
    form.addEventListener('submit',function(e){e.preventDefault();var d={};new FormData(form).forEach(function(v,k){d[k]=v;});
      if(validate){var er=validate(d);if(er){var m=$('#merr',root);m.textContent=er;m.hidden=false;return;}}

  });
}

/* texto para a codificação do PDF (Windows-1252): o que não existe nela é descartado */
function wb(str){
  var map={'–':'\x96','—':'\x97','‘':'\x91','’':'\x92','“':'\x93','”':'\x94','•':'\x95','€':'\x80','…':'\x85'};
  var o='', chars=Array.from(String(str==null?'':str));
  for(var i=0;i<chars.length;i++){
    var c=chars[i], n=c.codePointAt(0);
    if(n===9||n===10||n===13)o+=' ';
    else if(n<32||n===127)continue;
    else if(n<127||(n>=160&&n<=255))o+=c;
    else if(map[c])o+=map[c];
  }
  return o;
}
function cw(n,b){
  var T=b?HB:HV;
  if(n>=32&&n<127)return T[n-32];
  var sp={150:556,151:1000,145:222,146:222,147:b?500:333,148:b?500:333,149:350,128:556,133:1000,183:278,186:365,170:370,176:400,160:278};
  if(sp[n]!==undefined)return sp[n];
  var bc=String.fromCharCode(n).normalize('NFD').charCodeAt(0);
  if(bc>=32&&bc<127)return T[bc-32];
  return 556;
}

  var leg='Como ler: quadrado vazio = ainda falta; quadrado marcado = já resolvido. À direita de cada item fica a necessidade: Essencial, Útil ou Dispensável/esperar. Este material não substitui o obstetra e o pediatra.';
  wrapTxt(leg,false,8.5,CW).forEach(function(l){txt(M,cur+8,l,'F1',8.5,MUTED);cur+=11;});

  /* ----- um item: uma linha enxuta ----- */

    var nl=wrapTxt(i.n,true,10,QX-TX-8), ql=(i.q&&!i.t)?wrapTxt(i.q,false,9,QW):[];

  objs[5]='<< /Title ('+wb('Enxoval do bebê')+') /Producer (Enxoval do bebê) >>';

  var out='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n', offs=[];
  objs.forEach(function(o,k){offs.push(out.length);out+=(k+1)+' 0 obj\n'+o+'\nendobj\n';});

}
function exportPDF(){

function syncNow(){
  if(!SYNC_ON||!SY)return Promise.resolve();

  sy.busy=true; var rev0=rev; setMsg('Sincronizando…',false);
  return (async function(){
    var changed=false, done=false;
    try{
      for(var tries=0;tries<4&&!done;tries++){
        var r=await rpc('enx_ler',{p_codigo:SY.code});
        if(r&&r.erro){setMsg('Esse código não foi encontrado no servidor. Confira o código.',true);return;}
        if(typeof r.versao==='number')sy.ver=r.versao;
        var remote=sanitize(r.dados)||blank();
        var merged=SY.force?S:mergeStates(S,remote);
        if(cmp(merged)!==cmp(S)){S=merged;changed=true;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
        if(!(SY.dirty||SY.force||cmp(S)!==cmp(remote))){done=true;break;}
        var out=ext({},S); out.lastExport=null;
        var w=await rpc('enx_gravar',{p_codigo:SY.code,p_dados:out,p_base:r.versao});

    case 'codeCopy': copyCode(); break;
    case 'syncOff':
      confirmBox('Desconectar este aparelho?','Os dados continuam neste aparelho, mas deixam de sincronizar. Para voltar, entre de novo com o código.','Desconectar',true).then(function(ok){if(!ok)return;SY=null;saveSync();sy.msg='';sy.show=false;render();toast('Aparelho desconectado.');});
      break;
    case 'syncWipe':
      confirmBox('Apagar os dados do servidor?','Os dados do casal serão apagados do servidor e o código deixa de funcionar. Os dados continuam neste aparelho. Isso não pode ser desfeito.','Apagar no servidor',true).then(function(ok){
        if(!ok)return;
        rpc('enx_apagar',{p_codigo:SY.code}).then(function(){SY=null;saveSync();sy.msg='';sy.show=false;render();toast('Dados do servidor apagados.');},function(){toast('Não consegui apagar agora. Confira a internet.');});
      });
      break;
    case 'giftDel': var arr=S.gifts[el.dataset.g]||[]; arr.splice(+el.dataset.i,1); S.gifts[el.dataset.g]=arr; S.gt=Date.now(); save(); render(); break;
    case 'giftCDel':
      confirmBox('Apagar esta sugestão?','Os nomes dela também serão apagados.','Apagar',true).then(function(ok){
        if(!ok)return; S.giftCustom=S.giftCustom.filter(function(g){return g.id!==el.dataset.g;}); delete S.gifts[el.dataset.g]; S.gt=Date.now(); save(); render();});
      break;
  }
});
document.addEventListener('change',function(e){
  var el=e.target; var a=el.dataset&&el.dataset.act, id=el.dataset&&el.dataset.id;
  if(a==='cbC'){setItem(id,{s:el.checked?'c':undefined});render();}
  else if(a==='cbG'){setItem(id,{s:el.checked?'g':undefined});render();}
  else if(a==='mala'){setItem(id,{mb:el.checked});render();}
  else if(a==='cbX'){setItem(id,{s:el.checked?'x':undefined});render();}
});
document.addEventListener('input',function(e){
  var el=e.target, f=el.dataset&&el.dataset.f; if(!f||f==='due')return;
  if(f==='p'){var c=parseBRL(el.value);setItem(el.dataset.id,{p:c===null?undefined:c});}
  else if(f==='st'){setItem(el.dataset.id,{st:el.value});}
  else if(f==='nt'){setItem(el.dataset.id,{nt:el.value});}
});
document.addEventListener('focusin',function(e){
  var el=e.target; if(el.dataset&&el.dataset.f==='p'){var c=parseBRL(el.value);el.value=c===null?'':plainBRL(c);}
});
document.addEventListener('focusout',function(e){
  var el=e.target; if(el.dataset&&el.dataset.f==='p'){var c=parseBRL(el.value);el.value=c===null?'':brl(c);}
});
document.addEventListener('submit',function(e){
  var f=e.target, a=f.dataset&&f.dataset.act; if(!a)return; e.preventDefault();
  var fd=new FormData(f);
  if(a==='saveBudget'){var c=parseBRL($('#bud').value); if(c===null){toast('Escreva um valor, como 5.000,00.');return;} S.budget=c; S.pt=Date.now(); ui.editBudget=false; save(); render(); toast('Orçamento atualizado.');}
  else if(a==='saveProfile'){saveProfile(f);}
  else if(a==='giftAdd'){
    var g=f.dataset.g, who=String(fd.get('who')||'').trim().slice(0,60); if(!who){toast('Escreva o nome de quem vai dar.');return;}
    var arr=S.gifts[g]||[], low=who.toLowerCase();
    if(arr.some(function(x){return x.toLowerCase()===low;})){toast('Esse nome já está neste presente.');return;}
    var other=Object.keys(S.gifts).some(function(k){return k!==g&&(S.gifts[k]||[]).some(function(x){return x.toLowerCase()===low;});});
    arr.push(who); S.gifts[g]=arr; S.gt=Date.now(); save(); render(); if(other)toast(who+' também vai dar outro presente.');
    var inp=$('#gi-'+g); if(inp)inp.focus();
  }
  else if(a==='giftCAdd'){var t=String(fd.get('t')||'').trim().slice(0,80); if(!t){toast('Escreva o nome da sugestão.');return;} S.giftCustom.push({id:uid('gu'),t:t}); S.gt=Date.now(); save(); render();}
  else if(a==='malaAdd'){var n=String(fd.get('n')||'').trim().slice(0,120); if(!n){toast('Escreva o nome do item.');return;}
    S.custom.push({id:uid('u'),c:8,n:n,l:'U',q:'',m:'S',t:false,g:f.dataset.g,ts:Date.now()}); save(); render(); var i2=$('#ma-'+f.dataset.g); if(i2)i2.focus();}
});

window.__enx={derive:derive,MASTER:MASTER,state:function(){return S;},pdf:buildPDF};
render();
document.addEventListener('visibilitychange',function(){if(!document.hidden)syncNow();else if(SYNC_ON&&SY&&SY.dirty)syncNow();});
window.addEventListener('online',function(){syncNow();});
setInterval(function(){if(!document.hidden)syncNow();},45000);
setInterval(poll,4000);
if(SYNC_ON&&SY)syncNow();
})();
</script>
</body>
</html>
